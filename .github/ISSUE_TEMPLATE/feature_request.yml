name: 💡 功能建议
description: 提出新功能或改进想法。
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出想法。填写以下内容有助于我们对齐方向。
  - type: checkboxes
    id: preflight
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索过是否已有类似的建议。
          required: true
        - label: 这个建议不会鼓励超出授权使用范围或违反当地法律的用途。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 这个建议从什么问题·需求出发
      description: 请先说明想要解决的情形。理解问题比给出解决方案更重要。
      placeholder: "例：向团队分享检测结果时，希望能把报告导出为 PDF。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 请说明你认为应该怎么解决。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 如果想过其他办法，请一并写出来。
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及区域
      options:
        - 智能体 (agent)
        - Web UI / 服务端 (web / server)
        - LLM 供应商集成
        - 文档·翻译
        - 其他
    validations:
      required: false
