# pre-commit 配置示例（官方文档：https://pre-commit.com）
#
# 把仓库 CI 里两个确定性的合并关卡提前到本地提交阶段先跑一遍，让有问题的改动在
# push 之前就被拦住。任意一个 hook 断言失败都会以非 0 退出码结束，阻止提交。
#
# 1) detections —— 只有检测规则（detections/）或其锚定的上游源发生变化的提交，
#    才会跑一次性运行八个检测测试的 runner（detections/tests/run-all.sh）。
#    与 CI（.github/workflows/detections.yml）用同样的规则·源码范围先过一遍，
#    抓住只改规则却没更新测试·覆盖层的变更。需要 Docker（每个测试在容器里隔离
#    运行，runner 本身不装任何东西）。
# 2) docs —— 检查受跟踪 Markdown 文档的仓库内部链接·图片·锚点（#标题）引用是否
#    指向实际存在的目标（scripts/check-doc-links.py）。与 CI（.github/workflows/docs.yml）
#    是同一个检查，为了和那边不设 paths 过滤、对所有变更都跑一致，这里也不收窄
#    目标文件（always_run）。因为链接不只在改 .md 时失效，删除或移动链接指向的
#    文件（图片·LICENSE 等）时也会失效。只用 Python 标准库，不访问网络，不需要
#    Docker，几十毫秒内就能跑完。
#
# 安装：        pip install pre-commit && pre-commit install
# 手动运行：    pre-commit run detections --all-files
#              pre-commit run docs --all-files
#
# 这是只挂两个 hook 的最小示例。如果想连 Go·web 的 lint 一起挂上，在下面各自加 hook。
repos:
  - repo: local
    hooks:
      - id: detections
        name: 检测规则测试 8 种（Sigma·Suricata·ATT&CK·指标·MISP）
        entry: detections/tests/run-all.sh
        language: script
        pass_filenames: false
        files: '^(detections/|enrich/enrich\.go|selfupdate/(github|stage)\.go|guard/guard\.go|db/db\.go|db/schema\.sql|cmd/artex/main\.go|traffic/traffic\.go)'
      - id: docs
        name: 文档内部链接·图片·锚点（#标题）完整性检查
        entry: python3 -I scripts/check-doc-links.py
        language: system
        pass_filenames: false
        always_run: true
