name: web
# 对中文 UI（web/）的静态导出构建在每次推送·PR 时跑一遍，在合并前抓住前端回归。
# 发布流程（release.yml）只在打 tag（v*）时构建 web，而本 fork 没有打过 tag，
# 从未真正运行过 —— 所以日常 web 变更（TypeScript·React·i18n·next-intl）的验证
# 由这个工作流承担。Go 侧的构建·测试由 ci.yml 负责，这里只在 web/ 变化时运行
# （paths 过滤）。
on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  # 静态导出构建是合并关卡。`NEXT_EXPORT=1 next build` 在 next.config 没有配置
  # typescript.ignoreBuildErrors 的情况下会一并做 TypeScript 类型检查，
  # 一旦有类型错误或导出失败，这个 job 就会变红，挡住合并。
  #
  # biome 检查也是合并关卡。清理完上游带来的历史 lint 欠账（G7，错误从 8 清到 0：
  # skills 树 a11y 6 个 + package.json 格式化 1 个 + logo.svg noSvgWithoutTitle 1 个）
  # 之后，把这个原本仅供参考的步骤升级成了关卡。现在 `npm run check`（biome check）
  # 一旦报错，这个 job 就会变红挡住合并，防止清干净的状态再次变脏。
  # 警告·提示不影响退出码（biome 只在 error 级别才返回非 0），不会挡住合并。
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: build:static（合并关卡 · 含类型检查）
        run: npm run build:static
      - name: UI 韩文混入防护（合并关卡 · out HTML 中韩文为 0）
        # 本 fork 的核心成果是"用户可见界面没有韩文"。
        # 在合并前拦住贡献者硬编码韩文或翻译遗漏导致的回归。
        # 脚本会自行定位 git 根目录下的 web/out，与当前工作目录无关。
        run: python3 -I ../scripts/check-web-hangul.py
      - name: biome check（合并关卡 · 保持 lint·format·a11y 错误为 0）
        if: always()
        run: npm run check
