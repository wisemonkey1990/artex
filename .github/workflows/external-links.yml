name: external-links
# 检查受跟踪 Markdown 引用的外部链接（防御指南里的事件报告渠道 boho.or.kr·privacy.go.kr·
# pipc.go.kr·fsec.or.kr，CISA KEV，OWASP·SigmaHQ·Suricata·MITRE·MISP，原始演示，GitHub
# 徽章等）是否仍然存活。外部 URL 的存活依赖网络·远程服务器策略，结果不稳定，所以不放进
# 内部链接的合并关卡（docs.yml）。因此这个工作流不在推送·PR 时运行，只按每周计划和手动
# 触发（workflow_dispatch）运行，**不会挡住合并**，外部链接变更·下线时靠周期运行把它变红
# 曝出来。内部链接·锚点由 docs.yml 负责，Go 构建·分析·测试由 ci.yml 负责，检测规则由
# detections.yml 负责，中文 UI 构建由 web.yml 负责。
#
# --strict 只有在出现不在 allowlist（scripts/external-links-allowlist.txt）中的 DOWN
# （404·410·5xx·DNS/连接错误）时才失败。RESTRICTED（防爬虫·限流等，主机本身是活的）和
# ALLOWED（我们无法修复、继承自上游的失效链接）不计入失败，所以变红就是信号："我们文档
# 整理的外部链接出现了新的失效 —— 去看看"。计划任务只在默认分支（main）上运行。
on:
  schedule:
    - cron: "17 0 * * 1" # 每周一 00:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest 的 runner 自带 python3，脚本只用标准库，不需要额外安装。
      # 用 -I 隔离用户 site 和环境后运行。
      - name: 外部链接存活检查（浏览器 UA·GET·跟随重定向 · 排除 allowlist · 不挡合并）
        run: python3 -I scripts/check-external-links.py --strict
