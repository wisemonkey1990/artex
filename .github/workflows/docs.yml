name: docs
# 每次推送·PR 都检查受跟踪 Markdown 文档的仓库内部链接·图片引用是否指向实际存在的
# 文件，以及文档内锚点链接（#标题）是否指向目标文档中真实存在的标题，防止失效的
# 链接·图片·锚点被合并进来。链接指向的文件可能在仓库的任何位置（例如
# ../LICENSE·screenshots/ko/*.png），所以不设 paths 过滤，所有变更都跑一遍。
# 外部 URL（http/https/mailto）依赖网络会不稳定，不在这里检查 ——
# scripts/check-doc-links.py 只看内部引用。只用 Python 标准库，不访问网络，
# 结果是确定性的，不会因为 Docker Hub 限速之类的外部因素而忽红忽绿。Go 构建·
# 静态分析·测试由 ci.yml 负责，检测规则再现由 detections.yml 负责，中文 UI
# 构建由 web.yml 负责。
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# 同一分支有新的推送就取消前一次运行，避免堆积不必要的运行。
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest 的 runner 自带 python3，脚本只用标准库，不需要额外的安装
      # 步骤。用 -I 隔离用户 site 和环境后运行。
      - name: 文档内部链接·图片·锚点完整性检查
        run: python3 -I scripts/check-doc-links.py
