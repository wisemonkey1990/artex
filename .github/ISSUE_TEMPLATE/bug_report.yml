name: 🐛 报告 Bug
description: 报告行为与预期不符或出现错误的问题。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的报告。填写以下内容有助于我们更快复现和修复问题。
        **安全漏洞请不要使用本模板，请通过 [SECURITY.md](https://github.com/wisemonkey1990/artex/security/policy) 中的非公开流程报告。**
  - type: checkboxes
    id: preflight
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索过是否已有类似的 issue。
          required: true
        - label: 这个问题是在自己拥有/获得授权的目标，或本地隔离环境中复现的。
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 请同时说明预期行为和实际行为。
      placeholder: "例：检测结果应该输出中文，但实际输出了韩文。"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请按顺序列出能重现该问题的步骤。
      placeholder: |
        1. 打开 '...' 页面
        2. 执行 '...'
        3. 在 '...' 处出现错误
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志·截图
      description: 请附上相关日志或截图。请遮盖敏感信息（API 密钥·token·目标地址）。
      render: shell
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: 涉及区域
      description: 请选择问题出现的组件。
      options:
        - 智能体 (agent)
        - Web UI / 服务端 (web / server)
        - 安装·部署（Docker·脚本）
        - LLM 供应商集成
        - 文档·翻译
        - 不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 请填写发布 tag 或 commit hash。
      placeholder: "例：v2.2.0 或 b45ba04"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 请填写 OS、是否使用 Docker、LLM 模型等信息。
      placeholder: "例：macOS 15 / Docker Compose / claude-opus-4-8"
    validations:
      required: false
