on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  # 说明。
  # 说明。
  # 说明。
  #
  # 说明。
  # 说明。
  # 说明。
  # 说明。
  # 说明。
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: build:static（合并门禁 · 包含类型检查）
        run: npm run build:static
      - name: UI 汉字泄漏检查（合并门禁 · out HTML 中中文为零）
        # 说明。
        # 说明。
        # 说明。
        run: python3 -I ../scripts/check-web-cjk.py
      - name: biome check（合并门禁 · lint、format、a11y 错误为零）
        if: always()
        run: npm run check
