name: ci
# 每次推送和 PR 都跑一遍构建·静态分析·测试，在合并前抓住中文本地化过程中产生的回归。
# 发布流程（release.yml）只在打 tag（v*）时运行，只负责构建·发布，
# 所以日常变更的验证由这个工作流承担。
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # 在没有数据库的情况下跑构建·静态分析·测试。完全复现贡献者 clone 仓库后
  # 不装 PostgreSQL 直接跑 `go test ./...` 的环境。需要数据库的集成测试
  # 在这个环境下会用 t.Skipf 跳过（跳过算通过），所以构建·go vet·不依赖 DB
  # 的单元测试必须全部是绿色。光是这个组合就能在合并前抓住跨包的回归
  # （例如改了一个包的文案，却弄坏了另一个包的测试断言）。
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test（无 DB —— 跳过集成测试）
        run: go test ./... -count=1

  # 负责需要真实 PostgreSQL 才能跑的 DB 集成测试（通知·证据·用量计量等）。
  # 用真实数据库强制跑一遍上面 go job 会跳过的路径（通知渠道校验、证据存储、
  # llm_usage 计量等），在合并前抓住只有在 DB 集成路径才会暴露的中文本地化回归。
  #
  # 上游的测试框架设计成所有包共享一个数据库、表只建一次复用，隐含依赖包的
  # 执行顺序和累积数据，所以把所有包塞进同一个数据库跑会以各种方式互相搞坏
  # （累积数据污染、连接 teardown 竞争、重置时跨包的 schema 依赖）。所以这里
  # 给每个包单独起一个 PostgreSQL 服务，按"空数据库 + 单个包"的方式隔离运行。
  # 每个包作为独立 job（matrix）运行，互不触及对方的数据·连接·schema，这三种
  # 冲突在结构上就不会发生。db.Open 会自动迁移 schema，像 llm_usage 这种
  # db.Open 不会创建的表，由各测试自己用 EnsureLLMUsageTable 保证存在。
  go-db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent, config, db, evidence, llmrec, server]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go test（DB 集成 · ${{ matrix.pkg }} 包隔离）
        env:
          ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
        run: go test ./${{ matrix.pkg }}/ -count=1
