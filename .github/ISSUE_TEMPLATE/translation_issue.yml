name: 🌐 翻译·本地化问题
description: 报告中文翻译生硬、有误，或翻译缺失的问题。
title: "[翻译] "
labels: ["i18n"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助提升中文版的质量。
        本仓库的本地化方针是**只把用户可见的输出改成中文，智能体内部推理用的提示词，以及命令·payload·代码·日志原文保持原样**。
        详细原则见 [CONTRIBUTING.md](https://github.com/wisemonkey1990/artex/blob/main/CONTRIBUTING.md#本地化方针)。
  - type: dropdown
    id: kind
    attributes:
      label: 是什么类型的问题
      options:
        - 翻译生硬或不自然
        - 翻译有误（意思不对）
        - 翻译缺失（仍显示韩文·英文）
        - 不该翻译的内容被翻译了（命令·代码·日志等）
        - 需要统一用语
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 在哪里看到的
      options:
        - Web UI
        - 智能体输出（检测结果·摘要·报告·对话回复）
        - 文档（README 等）
        - 其他
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前文案
      description: 请原样粘贴目前显示的文案，最好也说明是在哪个页面·哪种情况下看到的。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议文案
      description: 请提出你认为更合适的改法（可选）。
    validations:
      required: false
  - type: input
    id: key
    attributes:
      label: 消息 key / 文件位置
      description: 如果知道的话填写。例如 web/messages/zh.json 中的 key 或文件路径。
      placeholder: "例：web/messages/zh.json → dashboard.title"
    validations:
      required: false
