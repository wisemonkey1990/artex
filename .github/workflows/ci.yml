name: ci
# 说明。
# 说明。
# 说明。
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # 说明。
  # 说明。
  # 说明。
  # 说明。
  # 说明。
  # 说明。
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test（无数据库，跳过集成测试）
        run: go test ./... -count=1

  # 说明。
  # 说明。
  # 说明。
  #
  # 说明。
  # 说明。
  # 说明。
  # 说明。
  # 说明。
  # 说明。
  # 说明。
  # 说明。
  go-db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent, config, db, evidence, llmrec, server]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go test（数据库集成 · ${{ matrix.pkg }} 包隔离）
        env:
          ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
        run: go test ./${{ matrix.pkg }}/ -count=1
