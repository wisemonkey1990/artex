on:
  push:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      - ".github/workflows/detections.yml"
  pull_request:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      - ".github/workflows/detections.yml"

permissions:
  contents: read

# 说明。
# 说明。
concurrency:
  group: detections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 测试套件注册表同步检查（run-all.sh ↔ CI ↔ 目录）
        run: detections/tests/check-harness-sync.sh
      - name: 主机分类工具自测（artex_host_triage.py --self-test · 非规则门禁）
        run: detections/tests/triage-selftest.sh
      - name: Sigma 规则复现测试（sigma check + 后端转换 + 指标保留）
        run: detections/tests/sigma/run.sh
      - name: Sigma 实际事件匹配测试（规则对恶意样本触发、对正常事件保持静默）
        run: detections/tests/sigma_match/run.sh
      - name: Sigma SigmaHQ 规范检查（完整验证器集合 + 文档化标准）
        run: detections/tests/sigma_lint/run.sh
      - name: Sigma 后端兼容性测试（验证关联规则可转换到多个后端）
        run: detections/tests/sigma_backends/run.sh
      - name: Suricata 规则复现测试（生成 pcap → suricata -r → 检查告警数量）
        run: detections/tests/suricata/run.sh
      - name: ATT&CK 覆盖层与规则一致性测试
        run: detections/tests/attack/run.sh
      - name: 检测指标与上游源码一致性测试（防止同步漂移）
        run: detections/tests/indicators/run.sh
      - name: 指标 MISP 导出与 CSV 同步测试（使用 pymisp 验证 MISP 格式）
        run: detections/tests/misp/run.sh
