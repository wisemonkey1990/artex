name: detections
# 检测规则（Sigma·Suricata·ATT&CK 层）变化的每次推送·PR 都用再现测试验证：规则确实
# 会触发，能转换到多个 SIEM 后端，覆盖层与规则一致，指标仍与上游源保持一致，并通过
# SigmaHQ 规范的全套校验。只改规则却没更新测试·覆盖层的变更会在这里变红。这是
# CONTRIBUTING.md 和 detections/tests/README.md 承诺的"八个测试机械式强制贡献契约"
# 真正落地成合并关卡的工作流。Go 构建·静态分析·测试由 ci.yml 负责。
# 除了八个测试，还有两个非规则关卡在同一个合并关卡里运行：测试框架注册表的
# 同步检查，以及主机分类工具（detections/triage/artex_host_triage.py）的自测。
# 这两个都独立于八个规则测试，run-all.sh 会把它们一起跑。
#
# 这八个测试只需要 Docker（ubuntu-latest 的 runner 自带 Docker）。runner 拉取
# sigma-cli·scapy·suricata·python 镜像，在容器里隔离运行，所以 runner 本身不装
# 任何东西，规则树和指标指向的源文件只以只读方式挂载，不写入仓库。除了
# detections/ 下有变化时触发，指标测试锚定的源文件变化时也会触发：enrich·
# selfupdate·guard·db 的 User-Agent·标记·破坏性命令 token，cmd/artex/main.go
# 的默认监听·代理端口，traffic/traffic.go 的 MITM CA 证书文件名，
# db/schema.sql 的探索图谱 schema 指纹都在其中。这样源码变更悄悄让规则·指标
# 列表过时的情况，会在合并关卡被抓住。因为是匿名拉取公开 Docker 镜像，偶尔会
# 撞上 Docker Hub 的下载限速，重新运行一次就能解决。
on:
  push:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      - ".github/workflows/detections.yml"
  pull_request:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      - ".github/workflows/detections.yml"

permissions:
  contents: read

# 同一分支有新的推送就取消前一次运行，避免频繁推送时堆积不必要的运行。
concurrency:
  group: detections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 测试框架注册表同步检查（run-all.sh ↔ CI ↔ 目录）
        run: detections/tests/check-harness-sync.sh
      - name: 主机分类工具自测（artex_host_triage.py --self-test · 非规则关卡）
        run: detections/tests/triage-selftest.sh
      - name: Sigma 规则再现测试（sigma check + 后端转换 + 指标保留）
        run: detections/tests/sigma/run.sh
      - name: Sigma 真实事件匹配测试（原子·关联规则在恶意样本/时间线上触发·在正常数据上静默）
        run: detections/tests/sigma_match/run.sh
      - name: Sigma SigmaHQ 规范 lint（完整校验器集合 + 文档化标准）
        run: detections/tests/sigma_lint/run.sh
      - name: Sigma 后端可移植性测试（确认关联规则能转换到多个后端）
        run: detections/tests/sigma_backends/run.sh
      - name: Suricata 规则再现测试（合成 pcap → suricata -r → 断言告警数）
        run: detections/tests/suricata/run.sh
      - name: ATT&CK 层 ↔ 规则一致性测试
        run: detections/tests/attack/run.sh
      - name: 检测指标 ↔ 上游源一致性测试（上游重同步漂移防护）
        run: detections/tests/indicators/run.sh
      - name: 指标 MISP 导出 ↔ CSV 同步测试（用 pymisp 校验 MISP 格式有效性）
        run: detections/tests/misp/run.sh
